<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            cursor: pointer;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        #studentPage {
            display: none;
        }

        .details {
            background: #f1f5f9;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container" id="loginPage">

    <h1>Student / Teacher Login</h1>

    <label for="role">Login as</label>

    <select id="role">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
    </select>

    <label for="username">Username / Roll Number</label>

    <input
        type="text"
        id="username"
        placeholder="Enter roll number"
    >

    <label for="dob">Date of Birth</label>

    <input
        type="date"
        id="dob"
    >

    <button onclick="login()">Login</button>

    <div id="message"></div>

</div>


<!-- Successful student page -->

<div class="container" id="studentPage">

    <h1>Welcome 25261A0579</h1>

    <div class="details">

        <h2>Student Details</h2>

        <p><strong>Roll Number:</strong> 25261A0579</p>

        <p><strong>Name:</strong> Demo Student</p>

        <p><strong>Date of Birth:</strong> 15/07/2008</p>

        <p><strong>Course:</strong> Engineering</p>

        <p><strong>Status:</strong> Active Student</p>

    </div>

</div>


<script>

function login() {

    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value.trim();
    const dob = document.getElementById("dob").value;

    const message = document.getElementById("message");

    // Demo credentials
    const correctUsername = "25261A0579";
    const correctDOB = "2008-07-15";

    // Teacher login is not configured
    if (role === "teacher") {

        message.textContent = "No data found.";
        message.style.color = "red";

        return;
    }

    // Check username
    if (username !== correctUsername) {

        message.textContent = "No data found.";
        message.style.color = "red";

        return;
    }

    // Check DOB
    if (dob !== correctDOB) {

        message.textContent = "Wrong input password.";
        message.style.color = "red";

        return;
    }

    // Successful login
    message.textContent = "";

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("studentPage").style.display = "block";
}

</script>

</body>
</html>
